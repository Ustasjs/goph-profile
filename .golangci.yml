version: "2"

linters:
  # Standard set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - noctx
    - revive
    - sqlclosecheck
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    # Generated OpenAPI package (make swagger); not hand-written code.
    paths:
      - docs

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ustasjs/goph-profile
  exclusions:
    paths:
      - docs
