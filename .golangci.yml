version: "2"

issues:
  # Generated OpenAPI package (make swagger); not hand-written code.
  exclude-dirs:
    - docs

linters:
  # Standard set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - noctx
    - revive
    - sqlclosecheck
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ustasjs/goph-profile
