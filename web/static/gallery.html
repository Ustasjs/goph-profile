<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Gallery</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl border border-white/20 overflow-hidden">
      <header class="bg-gradient-to-r from-purple-600 to-blue-600 p-6">
        <h1 class="text-3xl font-bold text-white text-center">Avatar Gallery</h1>
        <p id="subtitle" class="text-white/80 text-center mt-2"></p>
      </header>

      <main class="p-6">
        <div id="status" class="text-white/70 text-center py-8">Loading…</div>
        <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        <p class="text-center mt-6">
          <a href="/web/upload" class="text-purple-300 hover:text-purple-200 underline">Upload a new avatar</a>
        </p>
      </main>
    </div>
  </div>

  <script>
    // The user id is the last path segment: /web/gallery/{user_id}.
    const userId = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());
    document.getElementById('subtitle').textContent = 'User: ' + userId;

    const grid = document.getElementById('grid');
    const status = document.getElementById('status');

    function card(avatar) {
      const thumb = (avatar.thumbnails || []).find(t => t.size === '300x300');
      const src = thumb ? thumb.url : avatar.url;

      const cell = document.createElement('div');
      cell.className = 'bg-white/10 rounded-xl border border-white/20 overflow-hidden flex flex-col';

      const img = document.createElement('img');
      img.src = src;
      img.alt = avatar.file_name;
      img.className = 'w-full aspect-square object-cover';
      // Thumbnails may not exist yet (processing): fall back to the original.
      img.onerror = () => { if (img.src !== location.origin + avatar.url) img.src = avatar.url; };

      const footer = document.createElement('div');
      footer.className = 'p-2 flex items-center justify-between gap-2';

      const name = document.createElement('span');
      name.textContent = avatar.file_name;
      name.className = 'text-white/80 text-xs truncate';

      const del = document.createElement('button');
      del.textContent = 'Delete';
      del.className = 'text-red-300 hover:text-red-200 text-xs shrink-0';
      del.onclick = async () => {
        const resp = await fetch('/api/v1/avatars/' + avatar.id, {
          method: 'DELETE',
          headers: { 'X-User-ID': userId }
        });
        if (resp.ok) cell.remove();
        else alert('Delete failed: ' + resp.status);
      };

      footer.append(name, del);
      cell.append(img, footer);
      return cell;
    }

    async function load() {
      try {
        const resp = await fetch('/api/v1/users/' + encodeURIComponent(userId) + '/avatars');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const avatars = await resp.json();
        status.textContent = avatars.length ? '' : 'No avatars yet.';
        avatars.forEach(a => grid.append(card(a)));
      } catch (err) {
        status.textContent = 'Failed to load gallery: ' + err.message;
      }
    }

    load();
  </script>
</body>

</html>
