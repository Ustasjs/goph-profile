# Rancher Desktop overrides. The defaults are already local-friendly;
# this file only trims resources for a laptop cluster and pins the
# locally built tag explicitly.

image:
  tag: local
  pullPolicy: IfNotPresent

ingress:
  host: gophprofile.localhost

# Both assume the local stand: kube-router enforces the policies in
# k3s, and `make monitoring-install` provides the ServiceMonitor CRD —
# run it before enabling serviceMonitor here.
networkPolicy:
  enabled: true
serviceMonitor:
  enabled: true

server:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

worker:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
