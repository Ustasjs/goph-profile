# Rancher Desktop overrides. The defaults are already local-friendly;
# this file only trims resources for a laptop cluster and pins the
# locally built tag explicitly.

image:
  tag: local
  pullPolicy: IfNotPresent

ingress:
  host: gophprofile.localhost

# Assumes the local stand: `make monitoring-install` provides the
# ServiceMonitor CRD — run it before installing with this file.
serviceMonitor:
  enabled: true

server:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

worker:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
