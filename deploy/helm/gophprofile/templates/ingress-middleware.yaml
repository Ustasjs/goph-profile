{{- if and .Values.ingress.enabled (eq .Values.ingress.className "traefik") }}
# Upload size limit for the Traefik ingress class. Other controllers
# express the same limit as an annotation (ingress-nginx:
# nginx.ingress.kubernetes.io/proxy-body-size) via ingress.annotations.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "gophprofile.fullname" . }}-buffering
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
spec:
  buffering:
    maxRequestBodyBytes: {{ .Values.ingress.maxBodyBytes }}
{{- end }}
