{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gophprofile.fullname" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.ingress.className "traefik" }}
    # References to the Middlewares from ingress-middleware.yaml; the
    # format is <namespace>-<name>@kubernetescrd. Together they are
    # Traefik's equivalent of ingress-nginx's proxy-body-size and
    # limit-rps annotations.
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "gophprofile.fullname" . }}-buffering@kubernetescrd,{{ .Release.Namespace }}-{{ include "gophprofile.fullname" . }}-ratelimit@kubernetescrd
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gophprofile.fullname" . }}-server
                port:
                  name: http
{{- end }}
