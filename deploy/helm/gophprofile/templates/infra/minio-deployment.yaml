{{- if .Values.minio.enabled }}
# Deployment + PVC rather than a StatefulSet: single replica, one
# volume, no need for stable network identity. Recreate strategy so
# the replacement pod never races the old one for the volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gophprofile.minioHost" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gophprofile.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        {{- include "gophprofile.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data"]
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.auth.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.minio.auth.rootPassword | quote }}
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: miniodata
              mountPath: /data
      volumes:
        - name: miniodata
          persistentVolumeClaim:
            claimName: {{ include "gophprofile.minioHost" . }}
{{- end }}
