apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gophprofile.fullname" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
data:
  RUN_ADDRESS: ":8080"
  S3_ENDPOINT: {{ include "gophprofile.s3Endpoint" . | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  S3_USE_SSL: {{ .Values.config.s3UseSSL | quote }}
  WORKER_PREFETCH: {{ .Values.config.workerPrefetch | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otlpEndpoint | quote }}
  METRICS_ADDRESS: {{ .Values.config.metricsAddress | quote }}
  # When the hook Job owns the schema, server startup must not race
  # it; without the hook the server migrates itself as in compose.
  DATABASE_AUTO_MIGRATE: {{ not .Values.migrations.enabled | quote }}
