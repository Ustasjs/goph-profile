{{- if .Values.serviceAccount.create }}
# No Role or RoleBinding on purpose: the app never talks to the
# Kubernetes API, so the least-privilege setup is a dedicated account
# with no token mounted and nothing granted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gophprofile.fullname" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
