services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gophprofile
      POSTGRES_PASSWORD: gophprofile
      POSTGRES_DB: gophprofile
    ports:
      # 5434 on the host: the machine runs its own postgres on 5432,
      # which shadows the container for localhost connections.
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophprofile -d gophprofile"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  # MinIO images come from quay.io: the Docker Hub mirror rejects
  # anonymous pulls.
  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - miniodata:/data

  # One-shot bucket bootstrap. The server also ensures the bucket at
  # start, this just makes a bare "docker compose up" self-sufficient.
  minio-setup:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/avatars
      "

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692" # prometheus plugin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitdata:/var/lib/rabbitmq
      # Adds rabbitmq_prometheus on top of the image's default
      # management plugin.
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

  # Jaeger all-in-one with the built-in OTLP receiver. Traces live in
  # memory: a restart clears them, which is fine for a local stand.
  jaeger:
    image: jaegertracing/jaeger:2.4.0
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.4.2
    ports:
      - "3100:3100"
    volumes:
      - lokidata:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ships this project's container logs to Loki via the docker API.
  promtail:
    image: grafana/promtail:3.4.2
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./deploy/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy

  # Anonymous admin: a local training stand needs no login wall.
  grafana:
    image: grafana/grafana:11.6.1
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The app profile runs the built server and worker. A plain
  # "docker compose up -d" starts only the infrastructure for local
  # development; "docker compose --profile app up -d --build" runs
  # everything.
  server:
    build: .
    command: /app/server
    profiles: ["app"]
    ports:
      - "8080:8080"
    environment: &app-env
      DATABASE_DSN: postgres://gophprofile:gophprofile@postgres:5432/gophprofile?sslmode=disable
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: avatars
      S3_USE_SSL: "false"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      LOG_LEVEL: info
      RUN_ADDRESS: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      METRICS_ADDRESS: ":9091"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure

  # The worker starts after the server is healthy, so migrations are
  # already applied. There is no broker reconnect: on a lost
  # connection the worker exits and compose restarts it.
  worker:
    build: .
    command: /app/worker
    profiles: ["app"]
    environment: *app-env
    depends_on:
      server:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
  miniodata:
  rabbitdata:
  lokidata:
  grafanadata:
